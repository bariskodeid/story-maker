appId: com.bariskode.storymaker
productName: Story Maker
copyright: Copyright © 2026 bariskodeid
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  # The Remotion bundle ships as an extra resource (below), not inside app.asar.
  - '!out/remotion/**'
  - '!node_modules/ffmpeg-static/{README.md,example.js,install.js,ffmpeg.exe.README}'
extraResources:
  - from: resources/fonts
    to: fonts
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: licenses/FFmpeg-LICENSE.txt
  - from: resources/licenses
    to: licenses
  - from: node_modules/remotion/LICENSE.md
    to: licenses/Remotion-LICENSE.md
  - from: resources/whisper
    to: whisper
  - from: out/remotion
    to: remotion
asarUnpack:
  - node_modules/ffmpeg-static/**
  # Remotion's compositor and its FFmpeg are executables, which cannot run from inside app.asar.
  - node_modules/@remotion/compositor-*/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: StoryMaker-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Story Maker
npmRebuild: true
